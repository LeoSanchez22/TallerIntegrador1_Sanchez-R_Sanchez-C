name: CI/CD Pipeline - Sophia XAI

on:
  push:
    branches:
      - main
      - develop
      - develo
      - development
      - taller2
      - feature/taller2
      - feature/presentación-taller2
      - feature/presentacion-taller2
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - develo
      - development
      - taller2
      - feature/taller2
      - feature/presentación-taller2
      - feature/presentacion-taller2

jobs:
  test-backend:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

  test-frontend:
    name: Frontend Typecheck & Build Verification
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://azpwovaiicrkjxxvdjeq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-placeholder-anon-key-placeholder-anon-key
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify TypeScript Types
        run: |
          cd frontend
          npm run test

      - name: Run Frontend Build Verification
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to VPS
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # 1. Cargar entorno de NVM, Node, NPM y PM2
            export NVM_DIR="$HOME/.nvm"
            if [ -d "$NVM_DIR" ]; then
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi
            
            # Cargar perfiles bash
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true
            
            # Asegurar PATH
            export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            
            BRANCH="${{ github.ref_name }}"
            echo "========================================================="
            echo "🚀 Iniciando Despliegue de Rama: $BRANCH"
            echo "========================================================="
            
            # Determinar entorno según la rama
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ] || [ "$BRANCH" = "develo" ] || [ "$BRANCH" = "development" ]; then
                TARGET_DIR="/var/www/g2-diegoleo"
                PM2_BACKEND="sophia-backend"
                PM2_FASTAPI="sophia-fastapi"
                PM2_FRONTEND="sophia-frontend"
                PORT_BACKEND=5007
                PORT_FASTAPI=8000
                PORT_FRONTEND=5008
                APP_LABEL="TALLER INTEGRADOR 1 (tallerintegrador1.diegoproyectos.me)"
            else
                # Ramas de Taller 2 (subcarpeta dentro de g2-diegoleo para no requerir permisos root)
                TARGET_DIR="/var/www/g2-diegoleo/taller2"
                PM2_BACKEND="taller2-backend"
                PM2_FASTAPI="taller2-fastapi"
                PM2_FRONTEND="taller2-frontend"
                PORT_BACKEND=5017
                PORT_FASTAPI=8001
                PORT_FRONTEND=5018
                APP_LABEL="TALLER 2 (taller2.diegoproyectos.me)"
            fi
            
            echo "📦 Entorno: $APP_LABEL"
            echo "📁 Directorio Destino: $TARGET_DIR"
            echo "🔌 Puertos: Backend=$PORT_BACKEND | Frontend=$PORT_FRONTEND | FastAPI=$PORT_FASTAPI"
            
            # Si el directorio de Taller 2 no existe, clonarlo dentro del espacio de trabajo
            if [ ! -d "$TARGET_DIR/.git" ]; then
                echo "Inicializando espacio de trabajo en $TARGET_DIR..."
                mkdir -p "$TARGET_DIR"
                git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            
            # Actualizar código de Git
            echo "📥 Sincronizando código desde Git ($BRANCH)..."
            git fetch --all
            git checkout "$BRANCH" || git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"
            
            # Replicar variables de entorno de forma exhaustiva
            echo "📋 Sincronizando variables de entorno (.env)..."
            cp -f /var/www/g2-diegoleo/.env* "$TARGET_DIR/" 2>/dev/null || true
            cp -f /var/www/g2-diegoleo/backend/.env* "$TARGET_DIR/backend/" 2>/dev/null || true
            cp -f /var/www/g2-diegoleo/frontend/.env* "$TARGET_DIR/frontend/" 2>/dev/null || true
            if [ -f "/var/www/g2-diegoleo/.env" ]; then
                cp -f "/var/www/g2-diegoleo/.env" "$TARGET_DIR/backend/.env" 2>/dev/null || true
                cp -f "/var/www/g2-diegoleo/.env" "$TARGET_DIR/frontend/.env.local" 2>/dev/null || true
            fi
            if [ -f "/var/www/g2-diegoleo/backend/.env" ]; then
                cp -f "/var/www/g2-diegoleo/backend/.env" "$TARGET_DIR/.env" 2>/dev/null || true
            fi
            
            # --- 1. ACTUALIZAR Y REINICIAR BACKEND ---
            echo "⚙️ Configurando Backend..."
            cd "$TARGET_DIR/backend"
            npm install --omit=dev
            
            if pm2 describe "$PM2_BACKEND" > /dev/null 2>&1; then
                echo "🔄 Recargando $PM2_BACKEND..."
                PORT=$PORT_BACKEND FASTAPI_URL="http://127.0.0.1:$PORT_FASTAPI" pm2 reload "$PM2_BACKEND" --update-env || pm2 restart "$PM2_BACKEND" --update-env
            else
                echo "✨ Iniciando $PM2_BACKEND en PM2..."
                PORT=$PORT_BACKEND FASTAPI_URL="http://127.0.0.1:$PORT_FASTAPI" pm2 start src/index.js --name "$PM2_BACKEND" --update-env
            fi
            
            # --- 1.5. REINICIAR MICROSERVICIO FASTAPI ---
            cd "$TARGET_DIR"
            PYTHON_BIN="python3"
            if [ -d "$TARGET_DIR/venv" ]; then
                PYTHON_BIN="$TARGET_DIR/venv/bin/python"
            elif [ -d "/var/www/g2-diegoleo/venv" ]; then
                PYTHON_BIN="/var/www/g2-diegoleo/venv/bin/python"
            fi
            
            if pm2 describe "$PM2_FASTAPI" > /dev/null 2>&1; then
                echo "🔄 Recargando $PM2_FASTAPI..."
                pm2 reload "$PM2_FASTAPI" --update-env || pm2 restart "$PM2_FASTAPI" --update-env
            else
                echo "✨ Iniciando $PM2_FASTAPI en PM2..."
                pm2 start "$PYTHON_BIN -m uvicorn src_py.servidor_front:app --host 127.0.0.1 --port $PORT_FASTAPI" --name "$PM2_FASTAPI"
            fi
            
            # --- 2. ACTUALIZAR, COMPILAR Y REINICIAR FRONTEND ---
            echo "⚙️ Configurando Frontend..."
            cd "$TARGET_DIR/frontend"
            npm install
            
            echo "📦 Compilando Frontend (Next.js)..."
            npm run build
            
            if pm2 describe "$PM2_FRONTEND" > /dev/null 2>&1; then
                echo "🔄 Recargando $PM2_FRONTEND..."
                PORT=$PORT_FRONTEND pm2 reload "$PM2_FRONTEND" --update-env || PORT=$PORT_FRONTEND pm2 restart "$PM2_FRONTEND" --update-env
            else
                echo "✨ Iniciando $PM2_FRONTEND en PM2..."
                PORT=$PORT_FRONTEND pm2 start "npm run start -- -p $PORT_FRONTEND" --name "$PM2_FRONTEND"
            fi
            
            # Guardar lista de PM2
            pm2 save
            
            # --- 3. REFRESCAR NGINX ---
            echo "🌐 Recargando Nginx..."
            nginx-reload-g2 || sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || true
            
            echo "========================================================="
            echo "✅ ¡Despliegue exitoso para $APP_LABEL ($BRANCH)!"
            echo "========================================================="

